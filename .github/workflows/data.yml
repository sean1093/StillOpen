name: data

on:
  schedule:
    # 07:30 Asia/Taipei. GitHub cron is UTC and Taipei is a fixed UTC+8 with no
    # DST, so 07:30 local is 23:30 UTC on the *previous* UTC day.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest

    env:
      # scripts/build-data.ts derives both the CLOSESHOP cutoff (`today`) and the
      # office-calendar year from the process's local clock. The cron fires at
      # 23:30 UTC, which is already 07:30 the *next* day in Taipei, so on a
      # default-UTC runner every scheduled build would be one Taipei day behind:
      # a contract expiring today would stay listed for an extra day, and the
      # 1 January run would fetch the previous year's calendar. Pin the zone so
      # the build's "today" matches the data's. Delete this and the daily run
      # silently goes stale by a day.
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit because this job pushes. checkout@v4 defaults this to true,
          # but v5 flipped the default to false — on a major bump the rebuild
          # would still compute correct data, still go green, and silently fail
          # to deliver it, looking like a token permissions problem rather than
          # an action default change.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          # package.json engines is ^20.19.0 || ^22.12.0 || >=24.0.0 and .npmrc
          # sets engine-strict=true, so npm ci hard-fails outside that range.
          # 24 is the current LTS; 20 went end-of-life on 2026-04-30.
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Verify logic before touching data
        run: npm test

      # A gate failure exits non-zero here, so the commit step never runs and
      # yesterday's data keeps serving.
      #
      # Exit 75 is the one exception: the NHI host was unreachable even after
      # retries (since 2026-09-25 it resets every connection from GitHub's US
      # runners). No data was touched, so keeping the committed data/ is the
      # designed outcome and the run stays green with a warning, until
      # check:fresh finds data/ past ALERT_AFTER_DAYS and fails it. Every other
      # exit code, gates included, still fails here.
      - name: Rebuild data
        id: build
        run: |
          set +e
          npm run build:data
          code=$?
          if [ "$code" -eq 75 ]; then
            echo "unreachable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Fail if data has gone stale
        if: steps.build.outputs.unreachable == 'true'
        run: npm run check:fresh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "chore(data): refresh from NHI open data"
          git push
